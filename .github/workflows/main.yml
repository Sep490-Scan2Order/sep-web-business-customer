name: Deploy S2O Tenant Web to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile 
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SIGNALR_HUB_URL=${{ secrets.NEXT_PUBLIC_SIGNALR_HUB_URL }}
          tags: ${{ secrets.DOCKER_USERNAME }}/s2o-tenant-web:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/s2o-tenant-web:latest
            
            docker stop s2o-tenant-web || true
            docker rm s2o-tenant-web || true
            
            docker run -d \
              --name s2o-tenant-web \
              -p 3000:3000 \
              --restart unless-stopped \
              -e NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }} \
              -e NEXT_PUBLIC_SIGNALR_HUB_URL=${{ secrets.NEXT_PUBLIC_SIGNALR_HUB_URL }} \
              ${{ secrets.DOCKER_USERNAME }}/s2o-tenant-web:latest
            
            docker image prune -af
